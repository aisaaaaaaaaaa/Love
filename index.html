<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · SMS или Google</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 40px;
      max-width: 500px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.2);
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 6px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.4s ease;
    }
    h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      color: #666;
      margin-bottom: 28px;
      font-size: 14px;
    }
    .step {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .step.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .phone-input-wrapper {
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border-radius: 60px;
      padding: 4px 20px;
      border: 1px solid #ddd;
      transition: 0.2s;
    }
    .phone-input-wrapper:focus-within {
      border-color: #764ba2;
      background: white;
      box-shadow: 0 0 0 3px rgba(118,75,162,0.2);
    }
    .country-code {
      font-weight: 600;
      font-size: 18px;
      color: #333;
      padding-right: 8px;
    }
    .phone-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 18px;
      padding: 16px 0;
      outline: none;
    }
    .otp-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0 24px;
    }
    .otp-input {
      width: 60px;
      height: 70px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      border: 2px solid #e2e2e2;
      border-radius: 20px;
      background: #fafafa;
    }
    .otp-input:focus {
      border-color: #764ba2;
      outline: none;
      background: white;
      box-shadow: 0 0 0 3px rgba(118,75,162,0.2);
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      margin-top: 16px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .google-btn {
      background: #4285F4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .google-btn img {
      width: 22px;
      height: 22px;
    }
    .divider {
      text-align: center;
      margin: 20px 0 10px;
      color: #aaa;
      font-size: 14px;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .timer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #764ba2;
      font-weight: 500;
      cursor: pointer;
    }
    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
    .success-badge {
      text-align: center;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 60px;
      margin-top: 20px;
      font-weight: 500;
    }
    footer {
      font-size: 12px;
      text-align: center;
      margin-top: 32px;
      color: #aaa;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="step1" class="step active">
    <h2>Добро пожаловать</h2>
    <div class="sub">Войдите удобным способом</div>

    <!-- Кнопка входа через Google (Firebase) -->
    <button id="googleBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
      Продолжить с Google
    </button>

    <div class="divider">или</div>

    <!-- SMS форма -->
    <div class="phone-input-wrapper">
      <span class="country-code">+7</span>
      <input type="tel" id="phoneNumber" class="phone-input" placeholder="707 123 45 67" autocomplete="off">
    </div>
    <button id="sendCodeBtn">Получить код по SMS</button>
    <div class="error-msg" id="phoneError"></div>
  </div>

  <div id="step2" class="step">
    <h2>Код из SMS</h2>
    <div class="sub">Введите 4-значный код</div>
    <div class="otp-group">
      <input type="text" maxlength="1" class="otp-input" id="o1">
      <input type="text" maxlength="1" class="otp-input" id="o2">
      <input type="text" maxlength="1" class="otp-input" id="o3">
      <input type="text" maxlength="1" class="otp-input" id="o4">
    </div>
    <button id="verifyBtn">Подтвердить</button>
    <div class="timer" id="timerText">Запросить код повторно через 60с</div>
    <div class="error-msg" id="otpError"></div>
  </div>

  <div id="step3" class="step">
    <div class="success-badge">✅ Успешная регистрация! Перенаправление...</div>
  </div>

  <footer>Данные защищены • SMS через Twilio • Вход через Google</footer>
</div>

<!-- Firebase SDK (модули) -->
<script type="module">
  // TODO: ЗАМЕНИ НА СВОИ ДАННЫЕ ИЗ КОНСОЛИ FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyA949Thgea7kvkzj2FOBR7m5RgepmY0Qyc",
    authDomain: "love-ec66a.firebaseapp.com",
    projectId: "love-ec66a",
    storageBucket: "love-ec66a.firebasestorage.app",
    messagingSenderId: "392162813250",
    appId: "1:392162813250:web:523b06bcd8d1beb93dd4db"
  };

  // Импорт Firebase модулей
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Функция входа через Google (будет вызвана при клике на кнопку)
  window.googleLogin = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      // Сохраняем имя пользователя (опционально)
      localStorage.setItem('userName', user.displayName || user.email);
      // Редирект на dashboard
      window.location.href = '/dashboard.html';
    } catch (error) {
      console.error('Ошибка входа через Google:', error);
      alert('Не удалось войти через Google. Попробуйте позже.');
    }
  };

  // Если пользователь уже авторизован (сессия Firebase активна) — перенаправляем сразу
  onAuthStateChanged(auth, (user) => {
    if (user && window.location.pathname !== '/dashboard.html') {
      localStorage.setItem('userName', user.displayName || user.email);
      window.location.href = '/dashboard.html';
    }
  });

  // Привязываем обработчик к кнопке (если кнопка ещё не загружена, ждём)
  document.addEventListener('DOMContentLoaded', () => {
    const googleBtn = document.getElementById('googleBtn');
    if (googleBtn) googleBtn.onclick = window.googleLogin;
  });
</script>

<!-- Обычный JavaScript (логика SMS) -->
<script>
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');
  const progressFill = document.getElementById('progressFill');

  const phoneInput = document.getElementById('phoneNumber');
  const sendBtn = document.getElementById('sendCodeBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const phoneError = document.getElementById('phoneError');
  const otpError = document.getElementById('otpError');
  const timerText = document.getElementById('timerText');

  const otpInputs = ['o1','o2','o3','o4'].map(id => document.getElementById(id));

  let timerInterval = null;
  let canResend = false;

  function showStep(step) {
    step1.classList.remove('active');
    step2.classList.remove('active');
    step3.classList.remove('active');
    if (step === 1) step1.classList.add('active');
    if (step === 2) step2.classList.add('active');
    if (step === 3) step3.classList.add('active');
    if (step === 1) progressFill.style.width = '0%';
    if (step === 2) progressFill.style.width = '50%';
    if (step === 3) progressFill.style.width = '100%';
  }

  function getFullPhone() {
    let raw = phoneInput.value.replace(/\D/g, '');
    let last10 = raw.slice(-10);
    return '+7' + last10;
  }

  function startTimer(seconds = 60) {
    if (timerInterval) clearInterval(timerInterval);
    canResend = false;
    let remaining = seconds;
    timerText.innerText = `Повторно через ${remaining}с`;
    timerInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerText.innerText = '✅ Код не пришёл? Отправить снова';
        canResend = true;
      } else {
        timerText.innerText = `Повторно через ${remaining}с`;
      }
    }, 1000);
  }

  function handleOtp(index, event) {
    const input = otpInputs[index];
    if (event.inputType === 'deleteContentBackward' && index > 0 && input.value === '') {
      otpInputs[index-1].focus();
    } else if (input.value.length === 1 && index < 3) {
      otpInputs[index+1].focus();
    }
    const fullCode = otpInputs.map(i => i.value).join('');
    if (fullCode.length === 4) verifyBtn.click();
  }
  otpInputs.forEach((inp, idx) => {
    inp.addEventListener('input', (e) => handleOtp(idx, e));
  });

  async function sendCode() {
    const phone = getFullPhone();
    if (!phoneInput.value.replace(/\D/g, '')) {
      phoneError.innerText = 'Введите номер';
      phoneError.style.display = 'block';
      return;
    }
    phoneError.style.display = 'none';
    sendBtn.disabled = true;
    sendBtn.innerText = 'Отправка...';

    try {
      const response = await fetch('/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await response.json();
      if (data.ok) {
        showStep(2);
        startTimer(60);
        otpInputs.forEach(inp => inp.value = '');
        otpError.style.display = 'none';
        otpInputs[0].focus();
      } else {
        phoneError.innerText = data.error || 'Ошибка отправки';
        phoneError.style.display = 'block';
        sendBtn.disabled = false;
        sendBtn.innerText = 'Получить код';
      }
    } catch (err) {
      phoneError.innerText = 'Ошибка соединения с сервером';
      phoneError.style.display = 'block';
      sendBtn.disabled = false;
      sendBtn.innerText = 'Получить код';
    }
  }

  async function verifyCode() {
    const phone = getFullPhone();
    const code = otpInputs.map(i => i.value).join('');
    if (code.length !== 4) {
      otpError.innerText = 'Введите 4 цифры';
      otpError.style.display = 'block';
      return;
    }
    otpError.style.display = 'none';
    verifyBtn.disabled = true;
    verifyBtn.innerText = 'Проверка...';

    try {
      const response = await fetch('/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, code })
      });
      const data = await response.json();
      if (data.ok) {
        showStep(3);
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } else {
        otpError.innerText = data.error || 'Неверный код';
        otpError.style.display = 'block';
        verifyBtn.disabled = false;
        verifyBtn.innerText = 'Подтвердить';
      }
    } catch (err) {
      otpError.innerText = 'Ошибка соединения с сервером';
      otpError.style.display = 'block';
      verifyBtn.disabled = false;
      verifyBtn.innerText = 'Подтвердить';
    }
  }

  sendBtn.addEventListener('click', sendCode);
  verifyBtn.addEventListener('click', verifyCode);
  timerText.addEventListener('click', () => {
    if (canResend) sendCode();
  });
  phoneInput.addEventListener('input', function(e) {
    let val = e.target.value.replace(/\D/g, '');
    if (val.length > 10) val = val.slice(0,10);
    e.target.value = val;
  });
</script>
</body>
</html>
